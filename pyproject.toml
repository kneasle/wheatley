[project]
name = "wheatley"
dynamic = ["version"] # Read 'version' from version.txt, generated by the release
authors = [
    { name = "Ben White-Horne", email = "kneasle@gmail.com" },
]
description = "A program that will ring any set of bells in Ringing Room."
readme = "README.md"
requires-python = ">=3.8"
license.text = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    'numpy==1.19.5; python_version < "3.8"',
    'numpy; python_version >= "3.8"',
    "requests",
    "python-socketio~=5.8.0",
    "python-engineio~=4.5.1",
    "websocket-client",
]
urls = { Homepage = "https://github.com/Kneasle/wheatley/" }

[project.scripts]
wheatley = "wheatley.main:main"

[dependency-groups]
dev = [
    "black>=22.8.0",
    "mypy>=1.14.1",
    "pylint>=3.2.7",
    "pytest>=8.3.5",
    "types-requests>=2.32.0.20241016",
    "types-urllib3>=1.26.25.14",
]

[tool.black]
line-length = 110

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { file = "wheatley/version.txt" }

[tool.setuptools.packages.find]
include = ["wheatley*"]

[tool.setuptools.package-data]
wheatley = ["version.txt"]
