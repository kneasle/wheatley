name: "Testing/Linting/Fuzzing"

on:
  pull_request:
    branches:
      - main
      - release/*
  push:
    branches:
      - main
      - release/*
  

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python-version: [3.8, 3.11]

    steps:
      - uses: actions/checkout@v1
      
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
    
      - name: Install packages
        run: uv sync

      - name: Run linter
        run: uv run run-checks.py --lint

      - name: Run typechecker
        run: uv run run-checks.py --type-check

      - name: Run unit tests
        run: uv run run-checks.py --unit-test

      - name: Run fuzzer
        run: uv run run-checks.py --fuzz

      # - name: Run doc tests
      #   run: uv run run-checks.py --doc-test
